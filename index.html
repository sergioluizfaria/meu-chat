<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Simples</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; background: #f0f0f0; }
        #form { display: flex; padding: 10px; border-top: 1px solid #ccc; }
        input { padding: 10px; margin-right: 5px; }
        .msg { background: white; padding: 8px; margin-bottom: 5px; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="cadastro">
        <input type="text" id="nome" placeholder="Seu Nome">
        <input type="tel" id="tel" placeholder="Seu Telefone">
        <button onclick="entrar()">Entrar no Chat</button>
    </div>

    <div id="chat-container" style="display:none; flex-direction: column; height: 100%;">
        <div id="chat"></div>
        <div id="form">
            <input type="text" id="texto" placeholder="Digite uma mensagem..." style="flex:1">
            <button onclick="enviar()">Enviar</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com";

        // COLE AS CONFIGURAÇÕES DO SEU FIREBASE AQUI
        const firebaseConfig = { 
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "ID",
            appId: "ID_DO_APP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let usuario = "";

        window.entrar = () => {
            usuario = document.getElementById('nome').value;
            if(usuario) {
                document.getElementById('cadastro').style.display = 'none';
                document.getElementById('chat-container').style.display = 'flex';
                ouvirMensagens();
            }
        };

        window.enviar = async () => {
            const input = document.getElementById('texto');
            if(input.value) {
                await addDoc(collection(db, "mensagens"), {
                    nome: usuario,
                    texto: input.value,
                    hora: serverTimestamp()
                });
                input.value = "";
            }
        };

        function ouvirMensagens() {
            const q = query(collection(db, "mensagens"), orderBy("hora"));
            onSnapshot(q, (snapshot) => {
                const chat = document.getElementById('chat');
                chat.innerHTML = "";
                snapshot.forEach(doc => {
                    const m = doc.data();
                    chat.innerHTML += `<div class="msg"><b>${m.nome}:</b> ${m.texto}</div>`;
                });
                chat.scrollTop = chat.scrollHeight;
            });
        }
    </script>
</body>
</html>
